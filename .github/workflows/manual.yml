name: manual
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "chose environment"
        required: true
        default: "staging"
        type: choice
        options: 
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: working directory
        run: pwd | ls -la
      - name: deploye useing dockerhub
        run: docker compose -f -f build  
      - name: showing the chosing environment
        run: echo "the environment is ${{ inputs.environment }}"
      - name: deploye useing dockerhub
        run: docker image push 
